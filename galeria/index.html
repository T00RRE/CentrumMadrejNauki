<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" href="/assets/images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body>

    </div>

      <div class="gallery-grid">

        <button class="gallery-item" data-index="1" aria-label="Otwórz zdjęcie 2 z 14">
          <img src="/assets/images/Galeria/1000056766.jpeg" alt="Laboratorium pomysłów - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="2" aria-label="Otwórz zdjęcie 3 z 14">
          <img src="/assets/images/Galeria/1000058016.jpeg" alt="Laboratorium pomysłów - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="3" aria-label="Otwórz zdjęcie 4 z 14">
          <img src="/assets/images/Galeria/2.jpg" alt="Laboratorium pomysłów - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="4" aria-label="Otwórz zdjęcie 5 z 14">
          <img src="/assets/images/Galeria/3.JPG" alt="Laboratorium pomysłów - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="5" aria-label="Otwórz zdjęcie 6 z 14">
          <img src="/assets/images/Galeria/IMG_2604.jpeg" alt="Laboratorium pomysłów - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="6" aria-label="Otwórz zdjęcie 7 z 14">
          <img src="/assets/images/Galeria/IMG_2632.jpeg" alt="Laboratorium pomysłów - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="7" aria-label="Otwórz zdjęcie 8 z 14">
          <img src="/assets/images/Galeria/IMG_2641.jpeg" alt="Laboratorium pomysłów - Centrum Mądrej Nauki" loading="lazy">
        </button>

    </div>

  <!-- Nasze dzieła sztuki -->

      </div>

        <button class="gallery-item" data-index="8" aria-label="Otwórz zdjęcie 9 z 14">

        </button>

        <button class="gallery-item" data-index="9" aria-label="Otwórz zdjęcie 10 z 14">
          <img src="/assets/images/Galeria/IMG_3033.jpeg" alt="Zajęcia kreatywne - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="10" aria-label="Otwórz zdjęcie 11 z 14">

        </button>

        <button class="gallery-item" data-index="11" aria-label="Otwórz zdjęcie 12 z 14">

        <button class="gallery-item" data-index="12" aria-label="Otwórz zdjęcie 13 z 14">
          <img src="/assets/images/Galeria/IMG_3036.jpeg" alt="Zajęcia kreatywne - Centrum Mądrej Nauki" loading="lazy">
        </button>

        <button class="gallery-item" data-index="13" aria-label="Otwórz zdjęcie 14 z 14">

        </button>

    </div>
  </section>

</main>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Podgląd zdjęcia" tabindex="-1">

  <button class="lightbox__btn lightbox__close" id="lb-close" aria-label="Zamknij podgląd">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
    </svg>
  </button>

  <button class="lightbox__btn lightbox__prev" id="lb-prev" aria-label="Poprzednie zdjęcie">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <polyline points="15 18 9 12 15 6"/>
    </svg>
  </button>

  <button class="lightbox__btn lightbox__next" id="lb-next" aria-label="Następne zdjęcie">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" aria-hidden="true">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  </button>

  <div class="lightbox__content">
    <img id="lb-img" src="" alt="Zdjęcie z galerii">
    <p class="lightbox__counter" id="lb-counter" aria-live="polite"></p>
  </div>

</div>

<script src="/assets/js/layout.js"></script>
<script>
(function () {
  const images = [
    '/assets/images/Galeria/1.jpg',
    '/assets/images/Galeria/1000056766.jpeg',
    '/assets/images/Galeria/1000058016.jpeg',
    '/assets/images/Galeria/2.jpg',
    '/assets/images/Galeria/3.JPG',
    '/assets/images/Galeria/IMG_2604.jpeg',
    '/assets/images/Galeria/IMG_2632.jpeg',
    '/assets/images/Galeria/IMG_2641.jpeg',
    '/assets/images/Galeria/IMG_3032.jpeg',
    '/assets/images/Galeria/IMG_3033.jpeg',
    '/assets/images/Galeria/IMG_3034.jpeg',
    '/assets/images/Galeria/IMG_3035.jpeg',
    '/assets/images/Galeria/IMG_3036.jpeg',
    '/assets/images/Galeria/IMG_3092.jpeg'
  ];

  let current = 0;
  const lb      = document.getElementById('lightbox');
  const lbImg   = document.getElementById('lb-img');
  const lbCount = document.getElementById('lb-counter');

  function open(i) {
    current = (i + images.length) % images.length;
    lbImg.src = images[current];
    lbImg.alt = 'Zdjęcie ' + (current + 1) + ' z ' + images.length;
    lbCount.textContent = (current + 1) + ' / ' + images.length;
    lb.classList.add('is-open');
    document.body.style.overflow = 'hidden';
    lb.focus();
  }

  function close() {
    lb.classList.remove('is-open');
    document.body.style.overflow = '';
  }

  document.getElementById('lb-close').addEventListener('click', close);
  document.getElementById('lb-prev').addEventListener('click', function () { open(current - 1); });
  document.getElementById('lb-next').addEventListener('click', function () { open(current + 1); });

  lb.addEventListener('click', function (e) {
    if (e.target === lb) close();
  });

  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('is-open')) return;
    if (e.key === 'Escape')     { close(); }
    if (e.key === 'ArrowLeft')  { open(current - 1); }
    if (e.key === 'ArrowRight') { open(current + 1); }
  });

  // Touch swipe support
  let touchStartX = 0;
  lb.addEventListener('touchstart', function (e) { touchStartX = e.changedTouches[0].screenX; }, { passive: true });
  lb.addEventListener('touchend', function (e) {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff) > 50) { diff > 0 ? open(current + 1) : open(current - 1); }
  }, { passive: true });

  document.querySelectorAll('.gallery-item').forEach(function (el) {
    el.addEventListener('click', function () { open(parseInt(el.dataset.index, 10)); });
  });
})();
</script>
</body>
</html>
